plugins {
    id 'java'
}

import java.util.Locale

group = project.mod_group
version = project.mod_version

def motmBuildChannel = (project.findProperty('motm_build_channel') ?: 'public').toString().toLowerCase()
def motmInternalTestBuild = motmBuildChannel == 'internal'
def normalizeServerVersionRange = { raw ->
    def value = (raw ?: '*').toString().trim()
    if (value == '' || value == '*') {
        return '*'
    }
    if (value.startsWith('=') || value.startsWith('^') || value.startsWith('~') || value.endsWith('.x')) {
        return value
    }
    if (value ==~ /\d+\.\d+\.\d+/) {
        return "=${value}"
    }
    return value
}
def generatedBuildInfoDir = layout.buildDirectory.dir('generated/sources/motmBuildInfo/main/java')
def motmModId = project.mod_id.toString()
def resolveHytaleRootPath = {
    def explicitRoot = (project.findProperty('hytale_root') ?: System.getenv('HYTALE_ROOT'))?.toString()
    if (explicitRoot != null && !explicitRoot.isBlank()) {
        return explicitRoot
    }

    def appData = System.getenv('APPDATA')
    if (appData != null && !appData.isBlank()) {
        return "${appData}/Hytale"
    }

    def osName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    if (osName.contains('mac')) {
        return "${System.getProperty('user.home')}/Library/Application Support/Hytale"
    }

    return null
}
def hytaleRootPath = resolveHytaleRootPath()
def hytaleRoot = hytaleRootPath == null ? null : file(hytaleRootPath)
def hytaleServerJar = hytaleRoot == null ? null : file("${hytaleRoot}/install/release/package/game/latest/Server/HytaleServer.jar")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            srcDir generatedBuildInfoDir
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    if (hytaleServerJar != null) {
        compileOnly files(hytaleServerJar)
    }

    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.register('verifyHytaleInstall') {
    doLast {
        if (hytaleRoot == null) {
            throw new GradleException('Could not resolve the Hytale root. Set APPDATA, HYTALE_ROOT, or -Phytale_root=/path/to/Hytale.')
        }
        if (!hytaleServerJar.exists()) {
            throw new GradleException("Could not find HytaleServer.jar at ${hytaleServerJar}. Launch/update Hytale once through the official launcher, or pass -Phytale_root=/path/to/Hytale.")
        }
    }
}

tasks.register('diagnoseDevEnvironment') {
    doLast {
        println "MOTM development environment"
        println "  OS: ${System.getProperty('os.name')} ${System.getProperty('os.arch')}"
        println "  Java runtime: ${System.getProperty('java.version')} (${System.getProperty('java.home')})"
        println "  Hytale root: ${hytaleRoot == null ? '<unresolved>' : hytaleRoot}"
        println "  Hytale server jar: ${hytaleServerJar == null ? '<unresolved>' : hytaleServerJar}"
        println "  Server jar exists: ${hytaleServerJar != null && hytaleServerJar.exists()}"
        println "  Build channel: ${motmBuildChannel}"
    }
}

tasks.register('generateMotmBuildInfo') {
    outputs.dir(generatedBuildInfoDir)
    doLast {
        def outputDir = generatedBuildInfoDir.get().file('com/motm/MotmBuildInfo.java').asFile
        outputDir.parentFile.mkdirs()
        outputDir.text = """package com.motm;

public final class MotmBuildInfo {
    public static final String BUILD_CHANNEL = "${motmBuildChannel}";
    public static final boolean INTERNAL_TEST_BUILD = ${motmInternalTestBuild};

    private MotmBuildInfo() {
    }
}
"""
    }
}

compileJava {
    dependsOn tasks.named('generateMotmBuildInfo')
    dependsOn tasks.named('verifyHytaleInstall')
}

processResources {
    def serverVersionRange = normalizeServerVersionRange(project.findProperty('server_version'))
    inputs.property('server_version_range', serverVersionRange)
    filesMatching('manifest.json') {
        expand(
            'mod_id': project.mod_id,
            'mod_name': project.mod_name,
            'mod_version': project.mod_version,
            'mod_group': project.mod_group,
            'mod_description': project.mod_description,
            'server_version': serverVersionRange
        )
    }
}

jar {
    archiveBaseName = project.mod_id
    if (motmInternalTestBuild) {
        archiveClassifier = 'internal'
    }
}

tasks.register('installMod', Copy) {
    dependsOn jar
    dependsOn tasks.named('verifyHytaleInstall')

    from(tasks.named('jar'))
    into(hytaleRoot == null ? layout.buildDirectory.dir('missing-hytale-root') : file("${hytaleRoot}/UserData/Mods"))
    outputs.upToDateWhen { false }
    doFirst {
        def modsDir = file("${hytaleRoot}/UserData/Mods")
        if (modsDir.exists()) {
            fileTree(dir: modsDir, include: "${motmModId}-*.jar").files.each { delete it }
        }
    }
}
